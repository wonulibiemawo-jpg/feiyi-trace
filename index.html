<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="了解上海盘扣文化，浏览盘扣图鉴、学习制作步骤和参加知识练习。" />
    <title>上海盘扣文化</title>
  </head>
  <body>
    <script>
      const redirect = sessionStorage.getItem('gh-pages-redirect')
      const base = '%BASE_URL%'
      if (redirect) {
        sessionStorage.removeItem('gh-pages-redirect')
        if (redirect.startsWith(base) && !redirect.startsWith('//')) history.replaceState(null, '', redirect)
      }
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
