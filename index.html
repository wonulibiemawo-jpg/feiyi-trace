<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>非遗·寻迹 — 非物质文化遗产数字展示</title>
  </head>
  <body>
    <!-- GitHub Pages SPA 路由恢复：从 404.html 跳回后还原 URL -->
    <script>
      (function() {
        var redirect = sessionStorage.getItem('gh-pages-redirect');
        if (redirect) {
          sessionStorage.removeItem('gh-pages-redirect');
          // 去掉 base 前缀，用 history API 还原路径
          var base = '/feiyi-trace/';
          var path = redirect.replace(new URL(base, location.origin).pathname, '/') || '/';
          history.replaceState(null, '', path);
        }
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
